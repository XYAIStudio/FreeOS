name: Docker Publish

# 仅在版本标签（v*）上构建并同步发布镜像。
# 对外规范名：ghcr.io/xyaistudio/freeos
# Docker Hub 为可选镜像（需 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN）；
# 未配置 Hub secrets 时只推 GHCR，不让发版门禁因此变红。
#
# 触发路径：
#   1. 人工推送 v* tag → on.push.tags
#   2. Auto Tag 用 GITHUB_TOKEN 推 tag 后显式 workflow_dispatch（token push 不会触发 push 工作流）
#
# 注意：workflow_dispatch 下 metadata-action 的 type=semver 不可靠，
# 必须从 GITHUB_REF_NAME 显式解析版本号。
#
# FnOS FPK 由 Release 成功后自动 dispatch，并等待本工作流推送的 :{version} 就绪。
#
# 拉取示例：
#   docker pull ghcr.io/xyaistudio/freeos:latest
#   docker pull ghcr.io/xyaistudio/freeos:0.0.3
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    # 拒绝在非 v* ref 上误跑（例如 UI 里对 main 点 Run workflow）
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag ref
        id: ver
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            v*)
              echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
              echo "tag=$ref" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Expected refs/tags/v*, got ref_name=$ref"
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: image
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          ghcr="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "ghcr=${ghcr}" >> "$GITHUB_OUTPUT"
          images="${ghcr}"
          if [ -n "${HUB_USER}" ]; then
            hub="${HUB_USER}/freeos"
            echo "hub=${hub}" >> "$GITHUB_OUTPUT"
            images="${images}"$'\n'"${hub}"
          else
            echo "hub=" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME unset; publishing GHCR only (${ghcr})"
          fi
          {
            echo "images<<EOF"
            printf '%s\n' "${images}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.images }}
          # 显式 raw tag：兼容 push.tags 与 Auto Tag 的 workflow_dispatch
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
