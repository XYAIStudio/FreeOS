worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout main;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Keep proxy headers in this file. nginx:alpine does not guarantee the
    # Debian-specific /etc/nginx/proxy_params file exists.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    server {
        listen 80 default_server;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2 default_server;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        location = /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://xyos-backend:3000;
        }
        location /api/ai/ {
            limit_req zone=ai_limit burst=10 nodelay;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_pass http://xyos-backend:3000;
        }
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://xyos-backend:3000;
        }
        location /ws {
            proxy_pass http://xyos-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
        }
        # No Nginx static attachment path: all /uploads requests remain subject
        # to XYOS identity, tenant and resource authorization checks.
        location / {
            proxy_pass http://xyos-backend:3000;
        }
    }
}
